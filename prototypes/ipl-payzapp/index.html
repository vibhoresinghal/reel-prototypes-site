 const editable=target=>{
  const element=target?.nodeType===3?target.parentElement:target;
  return Boolean(element?.isContentEditable||element?.closest?.('input,textarea'));
 };
 for(const type of ['selectstart','dragstart'])document.addEventListener(type,event=>{
  if(!editable(event.target))event.preventDefault();
 },true);
 document.addEventListener('keydown',event=>{
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='a'&&!editable(event.target))event.preventDefault();
 },true);
})();
(()=>{
 let drag=null,blockClick=false;const settling=new Map();
 const skip='input,textarea,select,[contenteditable="true"],[role="slider"],.attention-strip,.map-page,.swipe-button,[data-mouse-drag="off"]';
 document.addEventListener('pointerdown',e=>{
  blockClick=false;if(e.pointerType!=='mouse'||e.button!==0||e.target.closest(skip))return;
  const candidates=[];for(let el=e.target;el;el=el.parentElement){const css=getComputedStyle(el);const doc=el===document.scrollingElement;
   const x=el.scrollWidth>el.clientWidth+1&&/auto|scroll/.test(css.overflowX),y=el.scrollHeight>el.clientHeight+1&&(doc?!/hidden|clip/.test(css.overflowY):/auto|scroll/.test(css.overflowY));
   if(x||y){const stop=settling.get(el);if(stop)stop();candidates.push({el,x,y});}
  }
  if(candidates.length)drag={id:e.pointerId,target:e.target,x:e.clientX,y:e.clientY,candidates,chosen:null};
 });
 window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.chosen){if(Math.hypot(dx,dy)<5)return;
   // Existing map, slider and sheet gestures retain ownership.
   for(let el=drag.target;el;el=el.parentElement)if(el.hasPointerCapture?.(e.pointerId)){drag=null;return;}
   const axis=Math.abs(dx)>Math.abs(dy)?'x':'y',c=drag.candidates.find(c=>c[axis]);if(!c){drag=null;return;}
   drag.chosen=c.el;drag.axis=axis;drag.left=c.el.scrollLeft;drag.top=c.el.scrollTop;
   drag.scale=c.el===document.scrollingElement?1:c.el.getBoundingClientRect().width/c.el.offsetWidth||1;
   if(axis==='x'&&getComputedStyle(c.el).scrollSnapType!=='none'){drag.snap=c.el.style.scrollSnapType;c.el.style.scrollSnapType='none';}

  if(!ended?.chosen||ended.snap===undefined)return;

(()=>{
 const roots='#phone,.attention-stage,.psf-home,.fto-home,.home';
 let held=null;

 function press(visual){release();if(!visual)return;visual.setAttribute('data-home-press-visual','');getComputedStyle(visual).scale;visual.setAttribute('data-home-pressed','');held=visual;}
 function at(node,x,y,padX=0,padBottom=0){if(!node)return false;const r=node.getBoundingClientRect();return r.width&&r.height&&x>=r.left-padX&&x<=r.right+padX&&y>=r.top-5&&y<=r.bottom+padBottom;}

  const {clientX:x,clientY:y}=event;
  const ipl=root.querySelector('#stage[data-scene^="spotlight-"]');
  if(ipl){
   const base=ipl.querySelector('img.art');
   if(base?.naturalWidth&&!ipl.querySelector('.ipl-home-tile')){
    for(let i=0;i<8;i++){const sx=30+(i%4)*132,sy=i<4?366:615;
     const cover=document.createElement('div');cover.className='ipl-home-tile-cover';Object.assign(cover.style,{position:'absolute',left:(sx/540*100)+'%',top:(sy/540*100)+'cqw',width:(84/540*100)+'cqw',height:(84/540*100)+'cqw',background:'white',pointerEvents:'none'});
     const visual=document.createElement('div');visual.className='ipl-home-tile';Object.assign(visual.style,{position:'absolute',inset:'0',overflow:'hidden'});
     const image=base.cloneNode();image.removeAttribute('class');Object.assign(image.style,{position:'absolute',width:(540/84*100)+'%',maxWidth:'none',height:'auto',left:(-sx/84*100)+'%',top:(-sy/84*100)+'%',clipPath:'none'});visual.append(image);cover.append(visual);base.parentElement.append(cover);
    }
   }
   if(event.target.closest('[aria-label="Open stadium scanner"]'))return ipl.querySelector('.ipl-home-tile');
   const tile=[...ipl.querySelectorAll('.ipl-home-tile')].find(node=>at(node,x,y,10,40));if(tile)return tile;
   if(event.target.closest('[aria-label="Explore IPL season"]'))return [...ipl.querySelectorAll('.spot')].find(node=>node.style.opacity==='1');
  }

  // Original Figma tile boxes, exported composite tiles, and FTO replacement icons.
  // Labels are separate siblings and are deliberately excluded from the animated box.
  const tiles=[...root.querySelectorAll('[data-source-home-tile],[data-fto-icon],[data-node-id],[id]')].filter(node=>{
   const s=getComputedStyle(node),w=parseFloat(s.width),h=parseFloat(s.height);
   return s.display!=='contents'&&s.display!=='none'&&s.visibility==='visible'&&((Math.abs(w-48)<.5&&Math.abs(h-48)<.5)||(node.matches('[data-fto-icon]')&&Math.abs(w-56)<.5&&Math.abs(h-56)<.5))&&!node.querySelector('p');
  });
  const tile=tiles.find(node=>!tiles.some(other=>other!==node&&other.contains(node))&&at(node,x,y,12,40));if(tile)return tile;
  const reminder=event.target.closest('[data-reminder]');if(reminder&&!event.target.closest('.reminder-close'))return reminder;
  const hit=event.target.closest('button,[role="button"]');
  if(root.matches('.home')){
   if(hit?.matches('.hero-hit'))return root.querySelector('.home-hero > .art');
   if(hit?.matches('.offer-banner-hit'))return root.querySelector('[data-node-id="473:16818"]');
  }
  if(root.matches('.fto-home')){
   if(hit?.getAttribute('aria-label')==='Zoomcar offer')return root.querySelector('[data-node-id="6898:24802"], [data-node-id="6797:46196"]');
   if(hit?.classList.contains('fto-home-offer'))return hit;
  }
  if(root.matches('.psf-home')&&at(root.querySelector('.psf-home-spotlight'),x,y))return root.querySelector('.psf-home-spotlight');
  if(root.matches('.attention-stage')){
   for(const id of ['14910','14701']){const art=root.querySelector('[data-node-id="423:'+id+'"]');if(art&&at(art,x,y))return art;}
  }
  return hit&&getComputedStyle(hit).display!=='contents'?hit:null;

 for(const type of ['pointerup','pointercancel'])document.addEventListener(type,release,true);
 window.addEventListener('blur',release);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)release();});
})();
