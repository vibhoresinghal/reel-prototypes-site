<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flows · Vibhore Singhal</title><meta name="description" content="A collection of interactive design work by Vibhore Singhal."><link rel="icon" href="assets/app-icon.svg"><link rel="stylesheet" href="gallery.css"></head>
